[project]
name = "genealogy-corpus"
version = "0.1.0"
description = "Versioned genealogy corpus validation and deterministic projections"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "firebase-admin>=7.7,<8",
    "google-cloud-storage>=3.15,<4",
    "email-validator>=2.3,<3",
    "jinja2>=3.1,<4",
    "jsonschema>=4.23",
    "psycopg[binary]>=3.2",
    "starlette>=0.47,<1",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "hatchling==1.33.0",
    "httpx>=0.28,<1",
    "mypy>=1.11",
    "pytest>=8.3",
    "pyyaml>=6,<7",
    "ruff>=0.7",
    "types-jsonschema>=4.23",
]

[project.scripts]
genealogy = "genealogy.cli:main"
genealogy-web = "genealogy.web.app:main"
genealogy-access = "genealogy.auth.operator:main"
genealogy-feedback = "genealogy.feedback.operator:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatch_build"
backend-path = ["."]

# The hook narrows this package root to tracked runtime files. No per-file list.
# Private roots/contexts are external; distributions still require publication review.
[tool.hatch.build]
ignore-vcs = true
only-include = ["src/genealogy"]

[tool.hatch.build.targets.wheel]
sources = ["src"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
# Paths are relative to the package root; newly tracked modules/resources match
# automatically. Untracked files never qualify, even with these extensions.
include = [
    "*.py",
    "auth/*.js",
    "notices/*.txt", "installation/*.md",
    "owner/*.html", "owner/*.css", "owner/*.js",
    "schemas/*.schema.json", "sql/*.sql",
    "web/templates/*.html", "web/templates/icons/*.svg",
    "web/static/*.css", "web/static/*.js", "web/static/*.woff2",
    "web/static/*.png", "web/static/*.svg", "web/static/*-LICENSE.txt",
    # Generic statistical rules only; no reviewed record contexts.
    "historical-names.json",
]

[tool.hatch.build.targets.sdist]
# Hatchling also supplies pyproject.toml, hatch_build.py and generated PKG-INFO. Keep the lock
# for reproducible dependency setup when rebuilding outside the checkout.
[tool.hatch.build.targets.sdist.force-include]
"uv.lock" = "uv.lock"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["firebase_admin", "firebase_admin.*"]
ignore_missing_imports = true
